<h2 mat-dialog-title class="dialog-title">Add Trade</h2>
<form [formGroup]="tradeForm" (ngSubmit)="onSubmit()" class="trade-form">
  <div class="form-fields">
    <mat-form-field appearance="outline" class="full-width" floatLabel="always">
      <mat-label>Commodity</mat-label>
      <mat-select formControlName="commodity" required>
        <mat-option *ngFor="let commodity of commodities" [value]="commodity">
          {{ commodity.code }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" floatLabel="always">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" floatLabel="always">
      <mat-label>Action</mat-label>
      <mat-select formControlName="action" required (selectionChange)="enableDisableFields($event.value)">
        <mat-option value="INSERT">INSERT</mat-option>
        <mat-option value="UPDATE">UPDATE</mat-option>
        <mat-option value="CANCEL">CANCEL</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" floatLabel="always">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type" required>
        <mat-option value="BUY">Buy</mat-option>
        <mat-option value="SELL">Sell</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close class="cancel-button">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="tradeForm.invalid" class="add-button">Add</button>
  </div>
</form>
